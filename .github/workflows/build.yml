name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            gettext \
            cmake \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython>=3.1,<3.4"
          python -m pip install "buildozer==1.6.0"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"

          echo "Downloading Android command line tools..."
          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip \
            -O /tmp/android-sdk.zip

          unzip -q /tmp/android-sdk.zip -d "$SDK"

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses || true

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

          echo "Android SDK packages installed:"
          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --list_installed

      - name: Clean project Buildozer state
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          yes | buildozer -v android debug

      - name: Show generated APK
        if: always()
        run: |
          echo "=== Generated APK files ==="
          find bin -type f -name "*.apk" -print 2>/dev/null || true
          ls -lah bin 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nba2k-universal-converter-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
