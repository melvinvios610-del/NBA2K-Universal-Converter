name: Build NBA2K Universal Converter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install Cython==0.29.34

      - name: Verify project
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "===== Python ====="
          python --version
          echo "===== Buildozer ====="
          buildozer --version

      - name: Clean Android build cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          yes | buildozer -v android debug

      - name: Show generated files
        if: always()
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin/ || true
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NBA2K-Universal-Converter-APK
          path: bin/*.apk
          if-no-files-found: error
