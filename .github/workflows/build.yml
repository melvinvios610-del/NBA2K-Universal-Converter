name: Build NBA2K Universal Converter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install "Cython==0.29.34"

      - name: Configure python-for-android
        run: |
          if grep -q "^p4a.branch" buildozer.spec; then
            sed -i 's/^p4a.branch.*/p4a.branch = develop/' buildozer.spec
          else
            printf '\np4a.branch = develop\n' >> buildozer.spec
          fi
          echo "Using p4a branch:"
          grep "^p4a.branch" buildozer.spec || true

      - name: Clean previous Android build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NBA2K-Universal-Converter-APK
          path: bin/*.apk
          if-no-files-found: error
