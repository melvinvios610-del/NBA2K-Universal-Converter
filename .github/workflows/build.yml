name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            gettext \
            cmake \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython>=3.1,<3.4"
          python -m pip install "buildozer==1.6.0"

      - name: Verify project configuration
        run: |
          echo "=== buildozer.spec ==="
          cat buildozer.spec

          echo "=== Checking main.py ==="
          python -m py_compile main.py

      - name: Clean old Buildozer state
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build debug APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          buildozer -v android debug

      - name: Show generated APK
        if: always()
        run: |
          echo "=== APK output ==="
          find . -type f -name "*.apk" -print 2>/dev/null || true

          echo "=== bin directory ==="
          ls -lah bin 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nba2k-universal-converter-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
