name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            gettext \
            cmake \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev \
            zlib1g-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython>=3.1,<3.4"
          python -m pip install "buildozer==1.6.0"

      - name: Clean previous Buildozer state
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build debug APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          buildozer -v android debug

      - name: List generated files
        if: always()
        run: |
          echo "=== bin ==="
          ls -lah bin || true
          echo "=== APK/AAB files ==="
          find . -maxdepth 4 -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nba2k-universal-converter-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
